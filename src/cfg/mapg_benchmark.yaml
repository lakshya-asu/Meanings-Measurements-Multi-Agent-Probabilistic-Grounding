# General
seed: 42
exp_name: msp${vlm.msp_nobnn.mode}
output_path: outputs_qwen_spatial/${exp_name}
results_filename: results_${vlm.msp_nobnn.mode}
gpu: 0
sim_gpu: 0

# Frozen benchmark split this config runs on (gate 2). Loaded and
# SHA-verified through src/splits.py. Preflight checks it.
split: bench_v1_98

# Model pins: map each floating model alias to a pinned snapshot id
# before running. Empty values are placeholders to be filled at run
# time. Runs must fail if a used alias has no pin; preflight enforces
# this (check f).
model_pins:
  # claude-opus-4-6 has NO dated snapshot suffix: the alias IS the
  # complete pinned id (verified against the live Anthropic docs,
  # 2026-08-15; a date-suffixed variant does not exist).
  claude-opus-4-6: 'claude-opus-4-6'
  # The cheap tier DOES have a dated id; pin the dated form.
  claude-haiku-4-5: 'claude-haiku-4-5-20251001'
  gpt-5.2-chat-latest: ''
  qwen3-vl-plus: ''

# MAPG-11 cost governor: hard per-run USD caps per provider plus a
# total. Any breach marks the run aborted in the store, writes the
# breach detail into the manifest, and exits nonzero. Adjust caps per
# launch; the weekly budget envelope is $500 across the core matrix.
cost_caps:
  claude: 25.0
  openai: 25.0
  gemini: 25.0
  qwen: 25.0
  total: 80.0

# Pinned model prices in USD per million tokens (input/output).
# Empty values are placeholders to be filled before any LLM run, same
# contract as model_pins: a run must fail loudly if a governed model
# has no pinned price, because unpriceable spend cannot be governed.
# Preflight enforces this (check h). Keys match by exact model name or
# by boundary prefix, so a snapshot id resolves to its base row.
model_prices:
  # USD per 1M tokens; verified against the claude-api reference and
  # the live Anthropic docs, 2026-08-15. Prompt-cache multipliers
  # (informational; the governor prices input/output): cache reads
  # ~0.1x input, cache writes 1.25x input on the 5-minute TTL (2x on
  # the 1-hour TTL).
  claude-opus-4-6:
    input: 5.00
    output: 25.00
  claude-haiku-4-5-20251001:
    input: 1.00
    output: 5.00
  # Rows for models without pinned prices stay commented out rather
  # than carrying '' placeholders: the governor fails loudly at init
  # on ANY unusable row, which would block even claude-only runs.
  # An unpriced model under a capped provider still fails loudly at
  # validate_models/accrual time, so removing the placeholder rows
  # loses no safety. Fill and uncomment before running these backends.
  # gpt-5.2-chat-latest:
  #   input: ''
  #   output: ''
  # gemini-2.5-pro:
  #   input: ''
  #   output: ''
  # gemini-3-pro-preview:
  #   input: ''
  #   output: ''
  # qwen3-vl-plus:
  #   input: ''
  #   output: ''

# Conservative per-call token estimate for calls whose provider did
# not expose token counts. Such spend is charged against the caps and
# also tracked separately as estimated spend.
fallback_tokens_per_call:
  prompt: 6000
  completion: 400

data:
  # Frozen split CSV, repo relative. Resolved through src/paths.py
  # (resolve_data_path), which maps relative paths onto the repo root.
  # In the container the repo is mounted at /workspace so the same
  # relative path works there too.
  question_data_path: 'splits/bench_v1_98.csv'
  question_data_path_choice: '/datasets/explore-eqa/eqa-questions.csv'
  # Was scene_init_poses_semantic_only_2.csv, which does not exist.
  # Of the existing candidates, _new covers 49 of the split's 64
  # scene_floor pairs (same columns), vs 28 for _semantic_only and 0
  # for _occlusion, so it is the closest match. Preflight reports the
  # remaining gaps.
  init_pose_data_path: '/datasets/explore-eqa/scene_init_poses_semantic_only_new.csv'
  init_pose_data_path_choice: '/datasets/explore-eqa/scene_init_poses.csv'
  semantic_annot_data_path: '/datasets/hm3d/train'
  scene_data_path: '/datasets/hm3d/train'
  explore_eqa_dataset_enrich_labels: '/cfg/explore_eqa_dataset_enrich_labels.yaml'
  use_semantic_data: True

logging:
  output_parent_dir: results
  save_obs: true
  save_freq: 10

scene_graph_sim:
  save_image: ${vlm.use_image}
  frontier_obj_thresh: 2.0
  enrich_rooms: True
  enrich_frontiers: True
  enrich_objects: False
  include_regions: False
  no_scene_graph: False
  key_frame_selection:
    use_clip_for_images: False
    use_siglip_for_images: True
    topk: 2
    visualize_best_image: False
    choose_final_image: True
  img_subsample_freq: 2

vlm:
  # We keep these fields because graph_eqa expects them,
  # but our MSP No-BNN planner does not call VLM.
  name: "gemini"
  use_image: True
  use_done_action: False
  early_exit: True
  add_history: False
  answer_mode: "msp_point"

  # MAPG-09: agent implementation. "unified" (default) = src/agents
  # stack, one prompt per role shared byte-identically across backends,
  # typed outputs, real per-call token usage. "legacy" = the historical
  # per-backend agent classes.
  agents_impl: "unified"

  # MAPG-10: scene-graph serialization for prompt text.
  # "compact" (default): line format, one node per line, 2 dp
  # coordinates, real AABB sizes, containment as room=, current agent
  # pose only, STABLE nodes first / volatile last (the prompt-caching
  # contract; see src/agents/serialization.py).
  # "legacy_json": the historical full-precision
  # json.dumps(nx.node_link_data(G)) dump (ablation arm).
  sg_serialization: "compact"

  # MAPG-10: per-role model tiering. null = the role's provider default
  # (main model; no behavior change). A model name overrides the
  # backend model for that role only; CallLog records model per call.
  # Safe demotion candidates per method-architecture-cost.md section 3:
  # orchestrator (runs once per episode after parse-once) and verifier
  # (programmatic checks gate every step; its LLM critique is optional
  # and off by default). Do NOT demote grounding/spatial without an
  # ablation. The MAPG-08 smoke will pin verifier/orchestrator to a
  # Haiku-class snapshot here.
  model_tiers:
    orchestrator: null
    grounding: null
    spatial: null
    verifier: null
    qa: null

  # >>> MSP No-BNN final config
  msp_nobnn:
    mode: "where"          # "which" or "where"
    top_k: 5
    confidence_threshold: 0.80

    # scoring options
    semantic_mode: "neutral"   # "neutral" or "candidate"
    sigma_s_scale: 0.50        # used only if semantic_mode=candidate
    sigma_m_scale: 0.30

    # where mode options
    where_top_frac: 0.02
    region_grid:
      half_extent_x: 3.0
      half_extent_y: 1.5
      half_extent_z: 3.0
      resolution: 28
      slice_dy: 0.25

planner:
  max_step_room_size_ratio: 3
  break_at_done: True

habitat:
  scene_type: 'hm3d'
  dataset_type: 'train'
  sim_gpu: ${sim_gpu}
  inflation_radius: 0.25
  img_width: 640
  img_height: 480
  camera_height: 1.5
  camera_tilt_deg: -30
  agent_z_offset: 0.
  hfov: 120
  z_offset: 0
  use_semantic_data: ${data.use_semantic_data}

hydra:
  glog_level: 0
  verbosity: 0
  label_space: 'hm3d'
  config_verbosity: 0

frontier_mapping:
  tsdf_grid_size: 0.1
  init_clearance: 0.5
  img_width: ${habitat.img_width}
  img_height: ${habitat.img_height}
  margin_w_ratio: 0.25
  margin_h_ratio: 0.3
  height_offset: 0.2
  range_height: [-0.2, 0.2]
  visual_prompt:
    cluster_threshold: 1.0
    num_clusters: 10
    num_prompt_points: 3
    num_max_unoccupied: 300
    min_points_for_clustering: 3
    point_min_dist: 1
    point_max_dist: 10
    cam_offset: 0.6
    min_num_prompt_points: 2
    circle_radius: 18
    frontier_min_neighbors: 2
    frontier_max_neighbors: 3
